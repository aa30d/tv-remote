name: Build APKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build debug & release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 7.6.3
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-7.6.3-bin.zip
          sudo unzip -q gradle.zip -d /opt
          echo "/opt/gradle-7.6.3/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Install Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | sort | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-33" "build-tools;33.0.2"

      - name: Build debug APK
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleDebug > build-debug.log 2>&1
          code=$?
          tail -n 20 build-debug.log
          if [ "$code" -ne 0 ]; then
            echo "::error::gradle :app:assembleDebug failed with exit code $code"
            grep -nE 'FAILURE|What went wrong|Could not|ERROR|error:|Caused by|Exception|> Task.*FAILED' build-debug.log | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$code"
          fi

      - name: Build release APK
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleRelease > build-release.log 2>&1
          code=$?
          tail -n 20 build-release.log
          if [ "$code" -ne 0 ]; then
            echo "::error::gradle :app:assembleRelease failed with exit code $code"
            grep -nE 'FAILURE|What went wrong|Could not|ERROR|error:|Caused by|Exception|> Task.*FAILED' build-release.log | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$code"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-remote-native-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-remote-native-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
