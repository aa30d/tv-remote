name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'تگی که باید منتشر شود (مثلاً v2.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 7.6.3
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-7.6.3-bin.zip
          sudo unzip -q gradle.zip -d /opt
          echo "/opt/gradle-7.6.3/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            APK نسخهٔ ریلیز (امضانشده) و نسخهٔ دیباگ پیوست شده‌اند.
            برای نصب، فایل `app-release-unsigned.apk` را روی گوشی کپی و نصب کنید
            (در صورت نیاز ابتدا با ابزارهای اندروید امضا کنید).
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
