name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'تگی که باید منتشر شود (مثلاً v2.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 7.6.3
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-7.6.3-bin.zip
          sudo unzip -q gradle.zip -d /opt
          echo "/opt/gradle-7.6.3/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Install Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | sort | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-33" "build-tools;33.0.2"

      - name: Build release APK
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleRelease > build-release.log 2>&1
          code=$?
          tail -n 20 build-release.log
          if [ "$code" -ne 0 ]; then
            echo "::error::gradle :app:assembleRelease failed with exit code $code"
            grep -nE 'FAILURE|What went wrong|Could not|ERROR|error:|Caused by|Exception|> Task.*FAILED' build-release.log | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$code"
          fi

      - name: Build debug APK
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleDebug > build-debug.log 2>&1
          code=$?
          tail -n 20 build-debug.log
          if [ "$code" -ne 0 ]; then
            echo "::error::gradle :app:assembleDebug failed with exit code $code"
            grep -nE 'FAILURE|What went wrong|Could not|ERROR|error:|Caused by|Exception|> Task.*FAILED' build-debug.log | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$code"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            APK نسخهٔ ریلیز (امضانشده) و نسخهٔ دیباگ پیوست شده‌اند.
            برای نصب، فایل `app-release-unsigned.apk` را روی گوشی کپی و نصب کنید
            (در صورت نیاز ابتدا با ابزارهای اندروید امضا کنید).
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
